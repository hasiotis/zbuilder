# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # libvirt-python (a mandatory dependency) is an sdist that needs pkg-config
  # and the libvirt headers to build - same as the CI workflows.
  apt_packages:
    - pkg-config
    - libvirt-dev
  jobs:
    post_create_environment:
      - pip install uv
    post_install:
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --locked --extra gcp --extra proxmox --group docs

# Optionally build your docs in additional formats such as PDF and ePub
formats: []

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py
