[project]
name = "zbuilder"
version = "0.2.2"
description = "Create VMs"
authors = [{ name = "Nikos Chasiotis", email = "hasiotis@gmail.com" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<4"
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "click>=8,<9",
    "Jinja2>=3.0,<4",
    "delegator.py>=0.1.1,<0.2",
    "colorama>=0.4,<0.5",
    "retrying>=1.3,<2",
    "requests>=2,<3",
    "arrow>=1.1,<2",
    "PyJWT>=2.5.0,<3",
    "dpath>=2.0,<3",
    "dnspython>=2,<3",
    "ansible>=14.3.1,<15",
    "setuptools>=84.0.0,<85",
    "massedit>=0.71.0",
    "ruamel-yaml>=0.19.1",
    "boto3>=1.43.73",
    "tabulate>=0.10.0",
    # The kvm provider. libvirt-python compiles against libvirt-dev, which has
    # to be present before `uv sync` - see the dependency-metadata block below.
    "libvirt-python>=11,<12",
    "pycdlib>=1.14,<2",
]

[project.optional-dependencies]
# The gcp providers (vm and dns) pull in the whole google client stack, which
# is a large dependency tree nobody outside GCP needs. zbuilder/vm/gcp.py and
# zbuilder/dns/gcp.py import it lazily and say what to install when missing.
gcp = [
    "google-auth-oauthlib>=0.4,<1.5",
    "oauthlib>=3.2.1,<4",
    "google-api-python-client>=2.198.0,<3",
    "google-cloud-dns>=0.37.0,<0.38",
]
# The proxmox provider talks to PVE through proxmoxer, which nobody outside a
# proxmox cluster needs. zbuilder/vm/proxmox.py imports it lazily and says what
# to install when it is missing.
proxmox = [
    "proxmoxer>=1.1,<3",
]

[project.urls]
Repository = "https://github.com/hasiotis/zbuilder"

[project.scripts]
zbuilder = "zbuilder.cli:cli"

# Provider plugins. Discovered at runtime by zbuilder.plugins, so an external
# distribution can register providers under the same groups.
[project.entry-points."zbuilder.vm"]
aws = "zbuilder.vm.aws:vmProvider"
gcp = "zbuilder.vm.gcp:vmProvider"
kvm = "zbuilder.vm.kvm:vmProvider"
proxmox = "zbuilder.vm.proxmox:vmProvider"

[project.entry-points."zbuilder.dns"]
aws = "zbuilder.dns.aws:dnsProvider"
bind = "zbuilder.dns.bind:dnsProvider"
gcp = "zbuilder.dns.gcp:dnsProvider"
powerdns = "zbuilder.dns.powerdns:dnsProvider"

[project.entry-points."zbuilder.ipam"]
phpipam = "zbuilder.ipam.phpipam:ipamProvider"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-md-report>=0.8.0",
]
docs = [
    "sphinx>=7.2.6,<8",
]

[tool.uv]
default-groups = ["dev"]

# libvirt-python ships as an sdist whose setup.py shells out to `pkg-config
# libvirt`, so uv cannot even read its metadata without libvirt-dev installed
# and `uv lock` fails on a machine that has no libvirt at all - CI included.
# Declaring the metadata here keeps resolution static; the package is still
# built the normal way at install time, which does need the libvirt headers.
[[tool.uv.dependency-metadata]]
name = "libvirt-python"
version = "11.10.0"
requires-dist = []

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = [ "tests" ]
filterwarnings = [
    # ansible starts its result thread before forking its workers, so every
    # playbook run forks a multi threaded process. Nothing zbuilder can fix.
    "ignore:This process .* is multi-threaded, use of fork.*:DeprecationWarning:multiprocessing.popen_fork",
]
md_report = true
md_report_verbose = "1"
md_report_color = "auto"
md_report_show_duration = true
