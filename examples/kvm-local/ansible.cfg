[defaults]
inventory = hosts
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
# The guests are rebuilt constantly and always come back on the same address,
# so a pinned host key is only ever in the way here.
host_key_checking = False

[ssh_connection]
pipelining = True
ssh_args = -o ForwardAgent=yes -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
