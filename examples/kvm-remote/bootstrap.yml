---
# Run automatically by `zbuilder build`, straight after the domains come up.
- hosts: all:!localhost
  gather_facts: false
  remote_user: sysadmin
  tasks:
    - name: bootstrap | Wait for ssh to become available
      local_action: wait_for port=22 host="{{ ansible_host }}" search_regex=OpenSSH delay=2 timeout=300

    - name: bootstrap | Wait for cloud-init to finish
      raw: cloud-init status --wait
      changed_when: false
