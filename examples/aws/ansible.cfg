[defaults]
inventory = hosts
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
# Instances are terminated and rebuilt under the same name, with a new host key
# every time, so a pinned key is only ever in the way here.
host_key_checking = False

[ssh_connection]
pipelining = True
ssh_args = -o ForwardAgent=yes -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
